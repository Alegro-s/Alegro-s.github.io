# Публикация портфолио на GitHub Pages после каждого пуша в main
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Сборка
        run: |
          mkdir _site
          cp -r index.html favicon.svg og.jpg robots.txt img fonts _site/
          [ -f CNAME ] && cp CNAME _site/
          BASE="${{ steps.pages.outputs.base_url }}"
          sed -i "s#https://__DOMAIN__#${BASE%/}#g" _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
